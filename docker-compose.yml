# Rodar localmente com Docker:
#   docker compose up --build
# Depois abra http://localhost:8888
#
# As variáveis (Firebase + STEAM_API_KEY) vêm do .env:
#   - VITE_* são usadas no BUILD (baked no site).
#   - STEAM_API_KEY é usada em RUNTIME pela function.
services:
  mamometro:
    build: .
    ports:
      - "8888:8888"
    env_file:
      - .env
    volumes:
      # F1 Fase 3: POST /api/onboard grava em roster/ via Admin SDK.
      # Reusa o mesmo SA json do demo-parser (mesma conta Firebase).
      - ./demo-parser/secrets/firebase-admin.json:/secrets/firebase-admin.json:ro
    environment:
      - PORT=8888
      - FIREBASE_SA_PATH=/secrets/firebase-admin.json
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Pipeline de demos (VPS) — F0 scaffold. Sem labels Traefik ainda; isso
  # entra em F2 quando o watcher do parser estiver no ar e o roteamento
  # para download/parse virar necessário.
  # ---------------------------------------------------------------------

  # cs-demo-downloader (https://github.com/Claabs/cs-demo-downloader)
  # Loga na conta descartável do bot, varre os share-codes dos jogadores
  # cadastrados e grava os .dem em ./demo-downloader/demos.
  demo-downloader:
    image: ghcr.io/claabs/cs-demo-downloader:latest
    container_name: demo-downloader
    restart: unless-stopped
    volumes:
      - ./demo-downloader/config:/config
      - ./demo-downloader/demos:/demos
    environment:
      - TZ=America/Sao_Paulo

  # demo-parser (./demo-parser) — F1+ watcher real.
  # Consome os .dem que o demo-downloader grava em /demos e publica
  # group matches em matches/ no RTDB. Retention: apaga o .dem após
  # processar (DELETE_AFTER_PROCESS controla). /demos é rw porque o
  # retention precisa escrever (unlink); FILE_STABILITY_SEC mitiga race
  # com o downloader.
  demo-parser:
    # Context = raiz do repo pra a imagem incluir o pacote compartilhado mm_common/.
    build:
      context: .
      dockerfile: demo-parser/Dockerfile
    container_name: demo-parser
    restart: unless-stopped
    volumes:
      - ./demo-downloader/demos:/demos
      - ./demo-parser/secrets/firebase-admin.json:/secrets/firebase-admin.json:ro
      - ./demo-downloader/config:/config:ro
    environment:
      - TZ=America/Sao_Paulo
      - DEMOS_DIR=/demos
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - FIREBASE_SA_PATH=/secrets/firebase-admin.json
      - ROSTER_PATH=/config/roster.json
      - GROUP_MIN_MEMBERS=${GROUP_MIN_MEMBERS:-3}
      - POLL_INTERVAL_SEC=30
      - DELETE_AFTER_PROCESS=true
      - FILE_STABILITY_SEC=5

  # roster-sync (./roster-sync) — F1+ watcher.
  # Observa `roster/` no RTDB e regenera o config.json do downloader
  # quando algo muda. NÃO reinicia o downloader — o operador roda
  # `docker compose restart demo-downloader` após ver o log
  # "wrote /config/config.json".
  roster-sync:
    # Context = raiz do repo pra a imagem incluir o pacote compartilhado mm_common/.
    build:
      context: .
      dockerfile: roster-sync/Dockerfile
    container_name: roster-sync
    restart: unless-stopped
    volumes:
      - ./roster-sync/secrets/firebase-admin.json:/secrets/firebase-admin.json:ro
      - ./demo-downloader/config:/config
    environment:
      - TZ=America/Sao_Paulo
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - FIREBASE_SA_PATH=/secrets/firebase-admin.json
      - CONFIG_OUTPUT_PATH=/config/config.json
      - POLL_INTERVAL_SEC=60
      - BOT_USERNAME=${STEAM_BOT_USERNAME}
      - BOT_PASSWORD=${STEAM_BOT_PASSWORD}
      - BOT_SHARED_SECRET=${STEAM_BOT_SHARED_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
