// ============================================================
//  Mamometro CS - Game State Integration (GSI)
//  Coloque este arquivo em:
//    Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg/
//  e reinicie o CS2.
//
//  IMPORTANTE: troque a URL abaixo pela do seu site publicado
//  (ex.: https://seu-site.netlify.app/.netlify/functions/gsi).
//  Dica: no painel do organizador, aba GSI, o botão "Baixar arquivo .cfg"
//  já gera este arquivo com a URL certa automaticamente.
// ============================================================
"Mamometro CS - GSI"
{
  "uri" "https://SEU-SITE.netlify.app/.netlify/functions/gsi"
  "timeout" "5.0"
  "buffer" "0.1"
  "throttle" "2.0"
  "heartbeat" "30.0"
  "auth"
  {
    "token" "mamometro-gsi"
  }
  "data"
  {
    "provider"           "1"
    "map"                "1"
    "round"              "1"
    "player_id"          "1"
    "player_state"       "1"
    "player_match_stats" "1"
  }
}
