# Configuração de deploy do Netlify.
# O build é feito pelo Vite; as functions ficam em netlify/functions.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Ao rodar `netlify dev`, ele sobe o Vite e faz o proxy das functions
# no mesmo host, resolvendo /.netlify/functions/* localmente.
[dev]
  command = "npm run vite"
  targetPort = 5173
  framework = "#custom"
